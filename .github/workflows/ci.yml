name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 宪章审计（三红线）
        run: npm run audit:tree

      - name: V2 校验（六段式/时效）
        run: npm run audit:v2

      - name: 单元测试（结构不变量 + 幂等 + 审计）
        run: npm test

      - name: 互链相关性红线审计
        run: node charter_links.mjs --strict

      # 可选：若后续需要校验前端可构建，取消下一行注释
      # - name: 构建前端
      #   run: npm run build
